    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;

      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(245, 158, 11, 1); }

      grid-template-rows: repeat(9, 1fr);

    .sudoku-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.125rem;
      cursor: pointer;
      border: 1px solid rgba(30, 41, 59, 0.8);
      background-color: rgba(15, 23, 42, 0.6);
      transition: all 0.15s ease;
    }

    .border-b-thick { border-bottom: 2.5px solid #38bdf8 !important; }
    .border-r-thick { border-right: 2.5px solid #38bdf8 !important; }

    .cell-highlight-crosshair { background-color: rgba(56, 189, 248, 0.15) !important; }
    .cell-selected { background-color: rgba(56, 189, 248, 0.4) !important; box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.8); }
    .cell-same-number { background-color: rgba(168, 85, 247, 0.3) !important; }
    .cell-correct { background-color: rgba(34, 197, 94, 0.25) !important; color: #4ade80 !important; font-weight: 900; }
    .cell-wrong { background-color: rgba(239, 68, 68, 0.35) !important; color: #fca5a5 !important; animation: shakeError 0.3s ease-in-out; }
    
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .backdrop-blur-custom { backdrop-filter: blur(8px); }
  </style>

    <script>
    // Audio Engine
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration) {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // PWA & Offline Support
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaInstallBanner').style.display = 'flex';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') closeInstallBanner();
          deferredPrompt = null;
        });
      } else {
        alert('لتثبيت اللعبة: اضغط على خيارات المتصفح (⋮) ثم اختر "الإضافة إلى الشاشة الرئيسية"');
      }
    }
    function closeInstallBanner() { document.getElementById('pwaInstallBanner').style.display = 'none'; }

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'tofiko-2026-v8';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // Starfield Animation
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({length: 60}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5,
        alpha: Math.random(),
        speed: 0.005 + Math.random() * 0.015
      }));
    }
    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if(star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.fillStyle = `rgba(186, 230, 253, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();

    // Players Count
    function updatePlayersCount() {
      let visits = parseInt(localStorage.getItem('tofiko_visits') || '0') + 1;
      localStorage.setItem('tofiko_visits', visits);
      const baseCounts = [51240, 52410, 50890, 53100, 51980];
      document.getElementById('livePlayersCount').innerText = baseCounts[visits % 5].toLocaleString('ar-EG');
    }
    updatePlayersCount();

    // 100% Mathematically Valid Sudoku Board Data (No Row, Column, or Box Conflicts)
    let selectedCellIndex = null;
    let isNotesMode = false;
    let isLightningActive = true;
    let mistakesCount = 0;
    let score = 1000;
    let historyStack = [];

    const solutionBoard = [
      5,3,4, 6,7,8, 9,1,2,
      6,7,2, 1,9,5, 3,4,8,
      1,9,8, 3,4,2, 5,6,7,
      
      8,5,9, 7,6,1, 4,2,3,
      4,2,6, 8,5,3, 7,9,1,
      7,1,3, 9,2,4, 8,5,6,
      
      9,6,1, 5,3,7, 2,8,4,
      2,8,7, 4,1,9, 6,3,5,
      3,4,5, 2,8,6, 1,7,9
    ];

    const initialBoard = [
      5,3,0, 0,7,0, 0,0,0,
      6,0,0, 1,9,5, 0,0,0,
      0,9,8, 0,0,0, 0,6,0,
      
      8,0,0, 0,6,0, 0,0,3,
      4,0,0, 8,0,3, 0,0,1,
      7,0,0, 0,2,0, 0,0,6,
      
      0,6,0, 0,0,0, 2,8,0,
      0,0,0, 4,1,0, 0,0,5,
      0,0,0, 0,8,0, 0,7,9
    ];

    let currentBoard = [...initialBoard];
    let notesBoard = Array.from({length: 81}, () => []);

    const sudokuGridEl = document.getElementById('sudokuGrid');

    function renderGrid() {
      sudokuGridEl.innerHTML = '';
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        const row = Math.floor(i / 9);
        const col = i % 9;
        
        cell.className = 'sudoku-cell';

        if (row === 2 || row === 5) cell.classList.add('border-b-thick');
        if (col === 2 || col === 5) cell.classList.add('border-r-thick');

        if (currentBoard[i] !== 0) {
          cell.innerText = currentBoard[i];
          if (initialBoard[i] !== 0) {
            cell.classList.add('text-cyan-300', 'font-black');
          } else {
            if (currentBoard[i] === solutionBoard[i]) {
              cell.classList.add('cell-correct');
            } else {
              cell.classList.add('cell-wrong');
            }
          }
        } else if (notesBoard[i].length > 0) {
          const notesGrid = document.createElement('div');
          notesGrid.className = 'grid grid-cols-3 w-full h-full p-0.5 text-[8px] text-slate-400 font-normal leading-none pointer-events-none';
          for (let n = 1; n <= 9; n++) {
            const noteSpan = document.createElement('span');
            noteSpan.className = 'flex items-center justify-center';
            noteSpan.innerText = notesBoard[i].includes(n) ? n : '';
            notesGrid.appendChild(noteSpan);
          }
          cell.appendChild(notesGrid);
        }

        cell.onclick = () => { selectCell(i); playTone(440, 'sine', 0.05); };
        sudokuGridEl.appendChild(cell);
      }
      applyHighlights();
    }

    function selectCell(index) {
      selectedCellIndex = index;
      applyHighlights();
    }

    function applyHighlights() {
      const cells = sudokuGridEl.children;
      if (selectedCellIndex === null) return;

      const selRow = Math.floor(selectedCellIndex / 9);
      const selCol = selectedCellIndex % 9;
      const selVal = currentBoard[selectedCellIndex];

      for (let i = 0; i < 81; i++) {
        const cell = cells[i];
        const r = Math.floor(i / 9);
        const c = i % 9;
        
        cell.classList.remove('cell-highlight-crosshair', 'cell-selected', 'cell-same-number');

        if (r === selRow || c === selCol) {
          cell.classList.add('cell-highlight-crosshair');
        }
        if (i === selectedCellIndex) {
          cell.classList.add('cell-selected');
        }
        if (selVal !== 0 && currentBoard[i] === selVal) {
          cell.classList.add('cell-same-number');
        }
      }
    }

    function inputNumber(num) {
      initAudio();
      if (selectedCellIndex === null || initialBoard[selectedCellIndex] !== 0) return;

      historyStack.push({
        index: selectedCellIndex,
        val: currentBoard[selectedCellIndex],
        notes: [...notesBoard[selectedCellIndex]]
      });

      if (isNotesMode) {
        const idx = notesBoard[selectedCellIndex].indexOf(num);
        if (idx > -1) notesBoard[selectedCellIndex].splice(idx, 1);
        else notesBoard[selectedCellIndex].push(num);
        currentBoard[selectedCellIndex] = 0;
        playTone(600, 'sine', 0.08);
      } else {
        currentBoard[selectedCellIndex] = num;
        notesBoard[selectedCellIndex] = [];

        if (solutionBoard[selectedCellIndex] !== num) {
          mistakesCount++;
          score = Math.max(0, score - 50);
          document.getElementById('mistakes').innerText = `${mistakesCount}/3`;
          document.getElementById('score').innerText = score;
          playTone(180, 'sawtooth', 0.2);
          
          if (mistakesCount >= 3) {
            alert('انتهت المحاولات! لقد ارتكبت 3 أخطاء.');
            resetGame();
          }
        } else {
          playTone(880, 'sine', 0.15);
        }
      }
      renderGrid();
    }

    function toggleLightning() {
      initAudio();
      isLightningActive = !isLightningActive;
      const btn = document.getElementById('btnLightning');
      btn.classList.toggle('bg-amber-500/20', isLightningActive);
      playTone(520, 'triangle', 0.1);
    }

    function toggleNotes() {
      initAudio();
      isNotesMode = !isNotesMode;
      const badge = document.getElementById('notesBadge');
      badge.className = isNotesMode ? 'absolute top-1 left-1 w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse' : 'absolute top-1 left-1 w-2 h-2 rounded-full bg-slate-600';
      playTone(550, 'sine', 0.1);
    }

    function erase() {
      initAudio();
      if (selectedCellIndex === null || initialBoard[selectedCellIndex] !== 0) return;
      currentBoard[selectedCellIndex] = 0;
      notesBoard[selectedCellIndex] = [];
      renderGrid();
      playTone(300, 'sine', 0.1);
    }

    function undo() {
      initAudio();
      if (historyStack.length === 0) return;
      const lastState = historyStack.pop();
      currentBoard[lastState.index] = lastState.val;
      notesBoard[lastState.index] = lastState.notes;
      renderGrid();
      playTone(450, 'sine', 0.1);
    }

    function getHint() {
      initAudio();
      if (selectedCellIndex === null || initialBoard[selectedCellIndex] !== 0) return;
      currentBoard[selectedCellIndex] = solutionBoard[selectedCellIndex];
      renderGrid();
      playTone(950, 'sine', 0.15);
    }

    document.getElementById('btnOpenLevels').onclick = () => {
      initAudio();
      document.getElementById('levelsModal').classList.remove('hidden');
      playTone(500, 'sine', 0.1);
    };
    document.getElementById('btnCloseLevels').onclick = () => {
      document.getElementById('levelsModal').classList.add('hidden');
    };

    function selectLevel(lvl) {
      initAudio();
      document.getElementById('levelsModal').classList.add('hidden');
      document.getElementById('landingScreen').classList.add('hidden');
      const levelNames = { easy: 'مبتدئ', simple: 'بسيط', medium: 'متوسط', hard: 'صعب', expert: 'خبير', extreme: 'قصوى' };
      document.getElementById('currentLevelName').innerText = `مستوى ${levelNames[lvl] || 'خبير'}`;
      resetGame();
      playTone(700, 'sine', 0.15);
    }

    function resetGame() {
      currentBoard = [...initialBoard];
      notesBoard = Array.from({length: 81}, () => []);
      mistakesCount = 0;
      score = 1000;
      document.getElementById('mistakes').innerText = '0/3';
      document.getElementById('score').innerText = score;
      renderGrid();
    }

    renderGrid();
  </script>
</body>
</html>
